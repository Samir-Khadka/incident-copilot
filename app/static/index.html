<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Copilot — Timeline</title>
<style>
  :root { --bg:#faf9f7; --card:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4;
          --accent:#4f46e5; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink);
         margin:0; padding:0 16px 60px; }
  header { max-width:900px; margin:0 auto; padding:28px 0 8px; }
  header h1 { font-size:1.4rem; margin:0 0 4px; }
  header p { color:var(--muted); margin:0; font-size:.9rem; }
  main { max-width:900px; margin:0 auto; }
  .filters { background:var(--card); border:1px solid var(--line); border-radius:12px;
             padding:16px; margin:16px 0; display:grid; gap:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
          display:block; margin-bottom:4px; }
  input, select, button { font-size:.88rem; padding:8px 10px; border:1px solid var(--line);
                         border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.chip { border-radius:999px; padding:6px 14px; }
  button.chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .around { border-top:1px dashed var(--line); padding-top:12px; }
  #status { color:var(--muted); font-size:.85rem; margin:8px 0; }
  .event { background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:12px 16px; margin:0 0 10px; display:flex; gap:12px; align-items:flex-start; }
  .badge { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
           padding:3px 9px; border-radius:999px; white-space:nowrap; margin-top:2px; }
  .badge.github { background:#ede9fe; color:#5b21b6; }
  .badge.docker { background:#e0f2fe; color:#0369a1; }
  .badge.ci { background:#fef3c7; color:#92400e; }
  .event .body { flex:1; min-width:0; }
  .event .title { font-weight:600; font-size:.93rem; }
  .event .meta { color:var(--muted); font-size:.78rem; margin-top:4px; }
  .event .meta a { color:var(--accent); }
  .event.fail { border-left:4px solid var(--bad); }
  .event.warn { border-left:4px solid var(--warn); }
  .event.ok { border-left:4px solid var(--ok); }
  #empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>🛰️ Incident Copilot</h1>
  <p>What changed? — every event from GitHub, CI and Docker in one timeline.</p>
</header>
<main>
  <div class="filters">
    <div class="row">
      <div><label for="f-since">Since</label><input type="datetime-local" id="f-since"></div>
      <div><label for="f-until">Until</label><input type="datetime-local" id="f-until"></div>
      <div><label for="f-source">Source</label><select id="f-source"><option value="">all</option></select></div>
      <div><label for="f-type">Type</label><select id="f-type"><option value="">all</option></select></div>
      <div><label for="f-repo">Repo</label><select id="f-repo"><option value="">all</option></select></div>
      <div><label>&nbsp;</label><button class="primary" id="f-apply">Apply</button></div>
    </div>
    <div class="row">
      <button class="chip" data-hours="1">last 1h</button>
      <button class="chip" data-hours="6">last 6h</button>
      <button class="chip" data-hours="24">last 24h</button>
      <button class="chip" id="chip-clear">clear</button>
    </div>
    <div class="row around">
      <div><label for="f-alert">Around alert time</label><input type="datetime-local" id="f-alert"></div>
      <div><label for="f-window">± window</label>
        <select id="f-window"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">60 min</option></select></div>
      <div><label>&nbsp;</label><button id="f-around">Show window</button></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="timeline"></div>
  <div id="empty" hidden>No events match these filters.</div>
</main>
<script>
const $ = id => document.getElementById(id);
const state = { limit: 200 };

function isoLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load() {
  const params = new URLSearchParams({ limit: state.limit });
  for (const [key, el] of [['since','f-since'],['until','f-until'],['source','f-source'],['type','f-type'],['repo','f-repo']]) {
    const v = $(el).value;
    if (v) params.set(key, key === 'since' || key === 'until' ? new Date(v).toISOString() : v);
  }
  $('status').textContent = 'Loading…';
  const r = await fetch('/api/events?' + params);
  const data = await r.json();
  $('status').textContent = `${data.total} event(s)`;
  render(data.events);
  populateSelects(data.events);
}

function populateSelects(events) {
  const seen = { source: new Set(), type: new Set(), repo: new Set() };
  events.forEach(e => { if (e.source) seen.source.add(e.source); if (e.type) seen.type.add(e.type); if (e.repo) seen.repo.add(e.repo); });
  for (const [key, sel] of [['source','f-source'],['type','f-type'],['repo','f-repo']]) {
    const cur = $(sel).value;
    $(sel).innerHTML = '<option value="">all</option>' +
      [...seen[key]].sort().map(v => `<option value="${v}">${v}</option>`).join('');
    if ([...seen[key]].includes(cur)) $(sel).value = cur;
  }
}

function tone(e) {
  const s = (e.title || '').toLowerCase();
  if (/fail|error|oom|died|destroy/.test(s)) return 'fail';
  if (/warn|cancel|pending/.test(s)) return 'warn';
  if (/success|pulled/.test(s)) return 'ok';
  return '';
}

function render(events) {
  const tl = $('timeline');
  $('empty').hidden = events.length > 0;
  tl.innerHTML = events.map(e => `
    <div class="event ${tone(e)}">
      <span class="badge ${e.source}">${e.source || '?'}</span>
      <div class="body">
        <div class="title">${escapeHtml(e.title || e.type)}</div>
        <div class="meta">${new Date(e.occurred_at).toLocaleString()} · ${escapeHtml(e.type)}${e.actor ? ' · ' + escapeHtml(e.actor) : ''}${e.repo ? ' · ' + escapeHtml(e.repo) : ''}${e.url ? ` · <a href="${escapeHtml(e.url)}" target="_blank">link</a>` : ''}</div>
      </div>
    </div>`).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('f-apply').onclick = load;
document.querySelectorAll('[data-hours]').forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll('[data-hours]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const now = new Date();
    $('f-since').value = isoLocal(new Date(now - chip.dataset.hours * 3600e3));
    $('f-until').value = '';
    load();
  };
});
$('chip-clear').onclick = () => {
  ['f-since','f-until','f-source','f-type','f-repo','f-alert'].forEach(id => $(id).value = '');
  document.querySelectorAll('[data-hours]').forEach(c => c.classList.remove('active'));
  load();
};
$('f-around').onclick = () => {
  const at = $('f-alert').value;
  if (!at) return;
  const t = new Date(at).getTime(), w = parseInt($('f-window').value, 10) * 60e3;
  $('f-since').value = isoLocal(new Date(t - w));
  $('f-until').value = isoLocal(new Date(t + w));
  load();
};
load();
</script>
</body>
</html>
